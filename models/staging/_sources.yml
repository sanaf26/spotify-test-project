version: 2

sources:
  - name: spotify
    database: data-cbf-485811
    schema: spotify_test_project
    tables:
      - name: spotify_tracks_raw
        loaded_at_field: CURRENT_TIMESTAMP()
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}

models:
  - name: stg_spotify_tracks
    columns:
      - name: track_id
        tests:
          - not_null

      - name: genre
        tests:
          - not_null

      - name: is_explicit
        tests:
          - not_null