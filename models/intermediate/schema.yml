version: 2

models:
  - name: int_track_artists
    columns:
      - name: track_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_spotify_tracks')
              field: track_id

      - name: artist_name
        tests:
          - not_null

  - name: artist_genre_performance
    description: "Aggregated model showing artist performance by genre."

    columns:
      - name: artist_name
        tests:
          - not_null

      - name: genre
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - artist_name
            - genre